version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: contract_analyzer_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: contract_analyzer
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d contract_analyzer"]
      interval: 5s
      timeout: 5s
      retries: 5

  ai-service:
    build: ./ai-service
    container_name: contract_analyzer_ai
    environment:
      - OLLAMA_URL=http://host.docker.internal:11434
    ports:
      - "8000:8000"
    volumes:
      - ./ai-service:/app

  backend:
    build: ./backend
    container_name: contract_analyzer_backend
    environment:
      - PORT=5000
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/contract_analyzer
      - AI_SERVICE_URL=http://ai-service:8000
      - JWT_SECRET=super_secret_contract_key_2026
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_started
    volumes:
      - ./uploads:/app/uploads

  frontend:
    build: ./frontend
    container_name: contract_analyzer_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
